<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>First APK - Neon Maze</title>
    <style>
        :root {
            --bg: #070918;
            --panel: #0f1531;
            --neon: #34ff99;
            --yellow: #ffe66d;
            --danger: #ff4f7d;
            --text: #d9e6ff;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: radial-gradient(circle at top, #1a245f, var(--bg) 60%);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .app {
            width: min(95vw, 520px);
            background: rgba(15, 21, 49, 0.9);
            border: 1px solid #3f4ea5;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(33, 255, 146, 0.2);
            padding: 1rem;
        }

        h1 {
            margin: 0 0 0.6rem;
            color: var(--neon);
            text-align: center;
            font-size: clamp(1.2rem, 4.5vw, 1.9rem);
        }

        .hud {
            display: flex;
            justify-content: space-between;
            gap: 0.6rem;
            font-size: 0.95rem;
            margin-bottom: 0.8rem;
        }

        .hud span {
            background: #101936;
            padding: 0.4rem 0.6rem;
            border-radius: 10px;
            border: 1px solid #2f438f;
            flex: 1;
            text-align: center;
        }

        canvas {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 14px;
            border: 1px solid #4864cd;
            background: #050816;
            display: block;
            touch-action: none;
        }

        .controls {
            margin-top: 0.8rem;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.45rem;
            user-select: none;
        }

        .controls button,
        .restart {
            background: linear-gradient(180deg, #2f4bd0, #1b2b79);
            border: none;
            color: #fff;
            border-radius: 10px;
            padding: 0.8rem;
            font-size: 1rem;
        }

        .controls .empty { visibility: hidden; }

        .status {
            text-align: center;
            min-height: 1.5rem;
            color: var(--yellow);
            margin-top: 0.6rem;
            font-weight: bold;
        }

        .restart {
            width: 100%;
            margin-top: 0.45rem;
            background: linear-gradient(180deg, #1fb96a, #14834a);
        }

        .tip {
            text-align: center;
            opacity: 0.9;
            font-size: 0.88rem;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <main class="app">
        <h1>First APK · Neon Maze</h1>
        <div class="hud">
            <span>Punti: <strong id="score">0</strong></span>
            <span>Vite: <strong id="lives">3</strong></span>
            <span>Livello: <strong id="level">1</strong></span>
        </div>
        <canvas id="game" width="420" height="420" aria-label="Gioco tipo Pac-Man"></canvas>
        <div class="controls">
            <div class="empty"></div>
            <button data-dir="up">⬆️</button>
            <div class="empty"></div>
            <button data-dir="left">⬅️</button>
            <button data-dir="down">⬇️</button>
            <button data-dir="right">➡️</button>
        </div>
        <button class="restart" id="restartBtn">Ricomincia</button>
        <p class="status" id="status"></p>
        <p class="tip">Touch mobile support + tastiera (frecce / WASD).</p>
    </main>

    <script>
        const mapRaw = [
            '###############',
            '#.............#',
            '#.###.###.###.#',
            '#o#.......#...#',
            '#.#.## ##.#.#.#',
            '#...# G #...#.#',
            '###.# ###.###.#',
            '#...#.....#...#',
            '#.###.###.###.#',
            '#.....P.......#',
            '###############'
        ];

        const tileSize = 28;
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');

        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        const levelEl = document.getElementById('level');
        const statusEl = document.getElementById('status');

        let map, dots, player, ghost, score, lives, level, poweredTimer, gameOver;

        function setupGame(resetLives = true) {
            map = mapRaw.map(row => row.split(''));
            dots = 0;
            poweredTimer = 0;
            gameOver = false;

            for (let y = 0; y < map.length; y++) {
                for (let x = 0; x < map[y].length; x++) {
                    if (map[y][x] === '.') dots++;
                    if (map[y][x] === 'P') {
                        player = { x, y, dir: { x: 0, y: 0 }, nextDir: { x: 0, y: 0 } };
                        map[y][x] = ' ';
                    }
                    if (map[y][x] === 'G') {
                        ghost = { x, y, dir: { x: 1, y: 0 } };
                        map[y][x] = ' ';
                    }
                }
            }

            if (resetLives) {
                score = 0;
                lives = 3;
                level = 1;
            }

            updateHud();
            statusEl.textContent = 'Mangia tutti i punti ed evita il fantasma!';
        }

        function updateHud() {
            scoreEl.textContent = score;
            livesEl.textContent = lives;
            levelEl.textContent = level;
        }

        function isWall(x, y) {
            if (y < 0 || y >= map.length || x < 0 || x >= map[0].length) return true;
            return map[y][x] === '#';
        }

        function moveEntity(entity, spd) {
            for (let i = 0; i < spd; i++) {
                if (entity === player) {
                    const nx = entity.x + entity.nextDir.x;
                    const ny = entity.y + entity.nextDir.y;
                    if (!isWall(nx, ny)) {
                        entity.dir = { ...entity.nextDir };
                    }
                }

                const tx = entity.x + entity.dir.x;
                const ty = entity.y + entity.dir.y;
                if (!isWall(tx, ty)) {
                    entity.x = tx;
                    entity.y = ty;
                }
            }
        }

        function chooseGhostDir() {
            const options = [
                { x: 1, y: 0 },
                { x: -1, y: 0 },
                { x: 0, y: 1 },
                { x: 0, y: -1 }
            ].filter(d => !isWall(ghost.x + d.x, ghost.y + d.y));

            options.sort((a, b) => {
                const da = Math.abs(player.x - (ghost.x + a.x)) + Math.abs(player.y - (ghost.y + a.y));
                const db = Math.abs(player.x - (ghost.x + b.x)) + Math.abs(player.y - (ghost.y + b.y));
                return poweredTimer > 0 ? db - da : da - db;
            });
            ghost.dir = options[0] || ghost.dir;
        }

        function collect() {
            if (map[player.y][player.x] === '.') {
                map[player.y][player.x] = ' ';
                score += 10;
                dots--;
            }
            if (map[player.y][player.x] === 'o') {
                map[player.y][player.x] = ' ';
                score += 50;
                poweredTimer = 30;
            }
        }

        function checkCollision() {
            if (player.x === ghost.x && player.y === ghost.y) {
                if (poweredTimer > 0) {
                    score += 200;
                    ghost.x = 7;
                    ghost.y = 5;
                    statusEl.textContent = 'Fantasma mangiato!';
                } else {
                    lives--;
                    updateHud();
                    if (lives <= 0) {
                        gameOver = true;
                        statusEl.textContent = 'Game Over! Premi Ricomincia.';
                    } else {
                        statusEl.textContent = 'Hai perso una vita!';
                        setupGame(false);
                    }
                }
            }

            if (dots <= 0) {
                level++;
                statusEl.textContent = 'Livello completato!';
                setupGame(false);
            }
        }

        function drawMap() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const offsetX = (canvas.width - map[0].length * tileSize) / 2;
            const offsetY = (canvas.height - map.length * tileSize) / 2;

            for (let y = 0; y < map.length; y++) {
                for (let x = 0; x < map[y].length; x++) {
                    const px = offsetX + x * tileSize;
                    const py = offsetY + y * tileSize;

                    if (map[y][x] === '#') {
                        ctx.fillStyle = '#243b98';
                        ctx.fillRect(px + 2, py + 2, tileSize - 4, tileSize - 4);
                    }
                    if (map[y][x] === '.') {
                        ctx.fillStyle = '#f4f7ff';
                        ctx.beginPath();
                        ctx.arc(px + tileSize / 2, py + tileSize / 2, 3, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    if (map[y][x] === 'o') {
                        ctx.fillStyle = '#ff9dff';
                        ctx.beginPath();
                        ctx.arc(px + tileSize / 2, py + tileSize / 2, 6, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            const playerPx = offsetX + player.x * tileSize + tileSize / 2;
            const playerPy = offsetY + player.y * tileSize + tileSize / 2;
            ctx.fillStyle = 'var(--yellow)';
            ctx.beginPath();
            ctx.arc(playerPx, playerPy, tileSize * 0.38, 0.2 * Math.PI, 1.8 * Math.PI);
            ctx.lineTo(playerPx, playerPy);
            ctx.fillStyle = '#ffe66d';
            ctx.fill();

            const ghostPx = offsetX + ghost.x * tileSize + tileSize / 2;
            const ghostPy = offsetY + ghost.y * tileSize + tileSize / 2;
            ctx.fillStyle = poweredTimer > 0 ? '#7cf3ff' : '#ff4f7d';
            ctx.beginPath();
            ctx.arc(ghostPx, ghostPy, tileSize * 0.34, Math.PI, 0);
            ctx.rect(ghostPx - tileSize * 0.34, ghostPy, tileSize * 0.68, tileSize * 0.34);
            ctx.fill();
        }

        function tick() {
            if (!gameOver) {
                moveEntity(player, 1);
                if (Math.random() < 0.3) chooseGhostDir();
                moveEntity(ghost, 1);
                collect();
                checkCollision();
                if (poweredTimer > 0) poweredTimer--;
                updateHud();
            }

            drawMap();
            requestAnimationFrame(tick);
        }

        function setDirection(dir) {
            const dirs = {
                up: { x: 0, y: -1 },
                down: { x: 0, y: 1 },
                left: { x: -1, y: 0 },
                right: { x: 1, y: 0 }
            };
            player.nextDir = dirs[dir] || player.nextDir;
        }

        document.addEventListener('keydown', (e) => {
            const keyMap = {
                ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
                w: 'up', s: 'down', a: 'left', d: 'right'
            };
            const dir = keyMap[e.key];
            if (dir) setDirection(dir);
        });

        document.querySelectorAll('[data-dir]').forEach(btn => {
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                setDirection(btn.dataset.dir);
            });
            btn.addEventListener('click', () => setDirection(btn.dataset.dir));
        });

        document.getElementById('restartBtn').addEventListener('click', () => setupGame(true));

        setupGame(true);
        requestAnimationFrame(tick);
    </script>
</body>
</html>
