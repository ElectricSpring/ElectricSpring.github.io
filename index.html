<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Little Computer People — Tribute Sim</title>
  <style>
    :root {
      --bg: #0f1a2f;
      --panel: #172640;
      --panel-2: #223556;
      --ink: #d8e7ff;
      --accent: #ffd166;
      --ok: #77dd77;
      --warn: #ffadad;
      --scan: rgba(255, 255, 255, 0.05);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Trebuchet MS", "Verdana", sans-serif;
      background: radial-gradient(circle at 20% 10%, #243b61 0%, #0a1222 60%, #060b16 100%);
      color: var(--ink);
      min-height: 100vh;
      padding: 1rem;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.25fr 0.75fr;
      gap: 1rem;
    }

    .panel {
      background: linear-gradient(180deg, var(--panel) 0%, #132036 100%);
      border: 2px solid #3d5e90;
      border-radius: 14px;
      box-shadow: 0 10px 35px rgba(0,0,0,.35);
      overflow: hidden;
      position: relative;
    }

    .panel::after {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(0deg, transparent 0 3px, var(--scan) 3px 4px);
      pointer-events: none;
    }

    h1 {
      margin: 0;
      font-size: 1.45rem;
      letter-spacing: .04em;
    }

    .title {
      padding: .9rem 1rem;
      border-bottom: 2px solid #36537f;
      background: linear-gradient(90deg, #2d4772, #1d3151);
    }

    canvas {
      width: 100%;
      max-width: 100%;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #0f1828;
    }

    .side {
      padding: 1rem;
      display: grid;
      gap: 1rem;
    }

    .meters { display: grid; gap: .55rem; }

    .meter { font-size: .9rem; }
    .meter-row {
      display: grid;
      grid-template-columns: 90px 1fr 40px;
      align-items: center;
      gap: .45rem;
    }

    .bar {
      height: 14px;
      border: 1px solid #6489bf;
      background: #0d1c34;
      border-radius: 7px;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      width: 50%;
      background: linear-gradient(90deg, #8fd3ff, #b7f9b4);
      transition: width .25s linear;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr;
      gap: .5rem;
    }

    button {
      border: 1px solid #7ea6dc;
      background: linear-gradient(180deg, #3b5c8f 0%, #2a4367 100%);
      color: #eff6ff;
      border-radius: 8px;
      font-weight: 700;
      padding: .55rem .7rem;
      cursor: pointer;
    }

    button:hover { filter: brightness(1.08); }

    .log {
      background: #0c1525;
      border: 1px solid #385a89;
      border-radius: 10px;
      min-height: 145px;
      max-height: 220px;
      overflow: auto;
      padding: .55rem .65rem;
      font-size: .86rem;
      line-height: 1.35;
    }

    .log p { margin: 0 0 .4rem; }

    .credits {
      font-size: .77rem;
      opacity: .86;
      border-top: 1px dashed #4d72a8;
      padding-top: .7rem;
    }

    .credits a { color: #a7d3ff; }

    @media (max-width: 900px) {
      .wrap { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="panel">
      <div class="title">
        <h1>Little Computer People — Mini Sim Tribute</h1>
      </div>
      <canvas id="game" width="720" height="432" aria-label="Casa con personaggio virtuale"></canvas>
    </section>

    <aside class="panel">
      <div class="title">
        <h1>Terminale Proprietario</h1>
      </div>
      <div class="side">
        <div class="meters">
          <div class="meter-row"><span>Umore</span><div class="bar"><div class="fill" id="moodBar"></div></div><span id="moodTxt">50</span></div>
          <div class="meter-row"><span>Fame</span><div class="bar"><div class="fill" id="hungerBar"></div></div><span id="hungerTxt">50</span></div>
          <div class="meter-row"><span>Energia</span><div class="bar"><div class="fill" id="energyBar"></div></div><span id="energyTxt">50</span></div>
        </div>

        <div class="buttons">
          <button id="knockBtn">Bussa alla porta</button>
          <button id="feedBtn">Invia snack</button>
          <button id="musicBtn">Metti disco jazz</button>
        </div>

        <div class="log" id="log"></div>

        <div class="credits">
          Basato sulle schermate storiche del gioco originale (1985):
          <a href="https://www.mobygames.com/game/1754/little-computer-people/screenshots/" target="_blank" rel="noopener">MobyGames gallery</a>,
          <a href="https://www.c64-wiki.com/wiki/Little_Computer_People" target="_blank" rel="noopener">C64-Wiki</a>.<br>
          Sprite: ridisegno originale pixel-art incluso in questa pagina (uso libero per questo progetto).
        </div>
      </div>
    </aside>
  </main>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const bars = {
      mood: document.getElementById('moodBar'),
      hunger: document.getElementById('hungerBar'),
      energy: document.getElementById('energyBar')
    };
    const txt = {
      mood: document.getElementById('moodTxt'),
      hunger: document.getElementById('hungerTxt'),
      energy: document.getElementById('energyTxt')
    };

    const logEl = document.getElementById('log');

    const state = {
      clock: 8,
      mood: 62,
      hunger: 42,
      energy: 70,
      activity: 'scrive una lettera',
      pos: { x: 135, y: 305 },
      target: { x: 135, y: 305 },
      frame: 0,
      danceTimer: 0,
      bubble: 'Buongiorno, vicino umano!'
    };

    const schedule = [
      { from: 6, to: 8, room: 'camera', x: 114, y: 178, act: 'si sveglia lentamente' },
      { from: 8, to: 11, room: 'studio', x: 132, y: 306, act: 'scrive una lettera' },
      { from: 11, to: 13, room: 'cucina', x: 465, y: 302, act: 'prepara una zuppa' },
      { from: 13, to: 16, room: 'salotto', x: 470, y: 182, act: 'legge il giornale' },
      { from: 16, to: 19, room: 'studio', x: 210, y: 306, act: 'accudisce il cagnolino' },
      { from: 19, to: 22, room: 'salotto', x: 550, y: 182, act: 'suona il piano' },
      { from: 22, to: 24, room: 'camera', x: 165, y: 178, act: 'si prepara per dormire' },
      { from: 0, to: 6, room: 'camera', x: 165, y: 178, act: 'dorme profondamente' }
    ];

    function addLog(message) {
      const p = document.createElement('p');
      p.textContent = `[${state.clock.toFixed(1).padStart(4, '0')}h] ${message}`;
      logEl.prepend(p);
      while (logEl.children.length > 12) logEl.removeChild(logEl.lastChild);
    }

    function clamp(v, min = 0, max = 100) {
      return Math.max(min, Math.min(max, v));
    }

    function updateMeters() {
      ['mood', 'hunger', 'energy'].forEach((k) => {
        const value = Math.round(state[k]);
        bars[k].style.width = `${value}%`;
        txt[k].textContent = value;
      });
    }

    function getCurrentRoutine() {
      return schedule.find((s) => state.clock >= s.from && state.clock < s.to) || schedule[0];
    }

    function aiTick() {
      state.clock += 0.008;
      if (state.clock >= 24) state.clock -= 24;

      const routine = getCurrentRoutine();
      state.target.x = routine.x;
      state.target.y = routine.y;
      state.activity = routine.act;

      state.hunger = clamp(state.hunger + 0.03);
      state.energy = clamp(state.energy - 0.025);
      state.mood = clamp(state.mood - 0.01 + (state.danceTimer > 0 ? 0.06 : 0));

      if (state.clock > 22 || state.clock < 6) {
        state.energy = clamp(state.energy + 0.035);
      }

      if (state.hunger > 82) {
        state.mood = clamp(state.mood - 0.08);
        state.bubble = 'Ho un certo languorino...';
      } else if (state.energy < 24) {
        state.bubble = 'Mi serve un pisolino.';
      } else if (state.danceTimer > 0) {
        state.bubble = 'Questo jazz è fantastico!';
      } else {
        state.bubble = `${state.activity}.`;
      }

      state.danceTimer = Math.max(0, state.danceTimer - 1);

      const dx = state.target.x - state.pos.x;
      const dy = state.target.y - state.pos.y;
      state.pos.x += Math.sign(dx) * Math.min(Math.abs(dx), 0.75);
      state.pos.y += Math.sign(dy) * Math.min(Math.abs(dy), 0.75);

      state.frame += 1;
      updateMeters();
    }

    function drawHouse() {
      const night = state.clock > 20 || state.clock < 6;
      ctx.fillStyle = night ? '#101826' : '#233958';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // rooms
      const rooms = [
        { x: 50, y: 50, w: 260, h: 150, color: '#7c6d59' },
        { x: 350, y: 50, w: 320, h: 150, color: '#6f5a49' },
        { x: 50, y: 230, w: 280, h: 150, color: '#5a6776' },
        { x: 350, y: 230, w: 320, h: 150, color: '#7a6a4d' }
      ];

      rooms.forEach((r) => {
        ctx.fillStyle = r.color;
        ctx.fillRect(r.x, r.y, r.w, r.h);
        ctx.strokeStyle = '#291f1a';
        ctx.lineWidth = 4;
        ctx.strokeRect(r.x, r.y, r.w, r.h);
      });

      // furniture hints
      ctx.fillStyle = '#c4ab74'; ctx.fillRect(72, 80, 82, 52); // bed
      ctx.fillStyle = '#26384e'; ctx.fillRect(95, 258, 75, 54); // desk
      ctx.fillStyle = '#c2935b'; ctx.fillRect(530, 258, 70, 56); // table
      ctx.fillStyle = '#3f2e2d'; ctx.fillRect(470, 125, 120, 20); // piano

      // time display
      ctx.fillStyle = '#e7f2ff';
      ctx.font = 'bold 18px monospace';
      ctx.fillText(`Ora virtuale: ${state.clock.toFixed(1)}h`, 460, 26);
    }

    function drawPerson() {
      const x = Math.round(state.pos.x);
      const y = Math.round(state.pos.y);
      const step = Math.floor(state.frame / 12) % 2;
      const armShift = state.danceTimer > 0 ? (step ? -4 : 4) : (step ? -1 : 1);

      // shadow
      ctx.fillStyle = 'rgba(0,0,0,.28)';
      ctx.fillRect(x - 8, y + 30, 18, 5);

      // body
      ctx.fillStyle = '#7cb2e8';
      ctx.fillRect(x - 6, y + 8, 12, 16);
      // head
      ctx.fillStyle = '#f0cb9e';
      ctx.fillRect(x - 5, y - 2, 10, 10);
      // hair
      ctx.fillStyle = '#3f2e23';
      ctx.fillRect(x - 5, y - 2, 10, 3);
      // legs
      ctx.fillStyle = '#2f4b6f';
      ctx.fillRect(x - 5, y + 24, 4, 10 + step);
      ctx.fillRect(x + 1, y + 24, 4, 10 + (step ? 0 : 1));
      // arms
      ctx.fillStyle = '#f0cb9e';
      ctx.fillRect(x - 9 + armShift, y + 10, 4, 9);
      ctx.fillRect(x + 5 - armShift, y + 10, 4, 9);

      // speech bubble
      const bubbleW = Math.min(260, 20 + state.bubble.length * 6.6);
      const bubbleX = Math.min(canvas.width - bubbleW - 12, Math.max(10, x - 40));
      const bubbleY = y - 44;
      ctx.fillStyle = 'rgba(235,246,255,.95)';
      ctx.fillRect(bubbleX, bubbleY, bubbleW, 24);
      ctx.strokeStyle = '#3f5d86';
      ctx.strokeRect(bubbleX, bubbleY, bubbleW, 24);
      ctx.fillStyle = '#1a2b48';
      ctx.font = '12px monospace';
      ctx.fillText(state.bubble.slice(0, 38), bubbleX + 6, bubbleY + 16);
    }

    function render() {
      drawHouse();
      drawPerson();
      requestAnimationFrame(render);
    }

    function loop() {
      aiTick();
      setTimeout(loop, 80);
    }

    document.getElementById('knockBtn').addEventListener('click', () => {
      state.mood = clamp(state.mood + 8);
      state.bubble = 'Toc toc! Ciao amico!';
      addLog('Hai bussato: lui risponde con entusiasmo.');
    });

    document.getElementById('feedBtn').addEventListener('click', () => {
      state.hunger = clamp(state.hunger - 26);
      state.mood = clamp(state.mood + 6);
      state.energy = clamp(state.energy + 4);
      state.bubble = 'Grazie per lo snack!';
      addLog('Snack consegnato tramite il vano digitale.');
    });

    document.getElementById('musicBtn').addEventListener('click', () => {
      state.danceTimer = 120;
      state.mood = clamp(state.mood + 10);
      state.bubble = 'Swing mode: ON';
      addLog('Hai inserito un disco jazz. Parte un balletto improvvisato.');
    });

    addLog('Sistema avviato. Tributo ispirato a Little Computer People.');
    updateMeters();
    loop();
    render();
  </script>
</body>
</html>
