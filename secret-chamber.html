<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electric Spring | Secret Chamber</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: 'Orbitron', monospace;
            background: radial-gradient(circle at top, #20104a 0%, #090916 60%, #05050d 100%);
            color: #d7fff3;
        }

        .panel {
            width: min(760px, 90vw);
            padding: 2rem;
            border-radius: 18px;
            border: 1px solid #00eaff;
            box-shadow: 0 0 25px rgba(0, 234, 255, 0.4), inset 0 0 25px rgba(57, 255, 20, 0.12);
            background: rgba(4, 9, 35, 0.85);
        }

        h1 {
            margin-top: 0;
            color: #39ff14;
            text-shadow: 0 0 10px #39ff14;
            letter-spacing: 0.12em;
        }

        .blink {
            color: #ff00c8;
            animation: blink 1.2s infinite;
        }

        @keyframes blink {
            50% { opacity: 0.4; }
        }

        code {
            display: block;
            margin-top: 1rem;
            padding: 0.8rem;
            border-radius: 10px;
            border: 1px dashed #a78bfa;
            background: rgba(167, 139, 250, 0.1);
            color: #e8ddff;
        }

        a {
            color: #00eaff;
        }
    </style>
</head>
<body>
    <main class="panel">
        <h1>ACCESS LEVEL 312</h1>
        <p class="blink">Secret channel unlocked.</p>
        <p>Welcome to the hidden node of Electric Spring. Since this is a test vault, your mission is simple:</p>
        <code>
            [ Mission ]
            1. Keep building weird and futuristic stuff.
            2. Push to GitHub Pages.
            3. Don't tell the robots where this room is.
        </code>
        <p><a href="index.html">Return to main gateway</a></p>
    </main>
</body>
</html>
